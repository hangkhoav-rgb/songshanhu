server:
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-test-test-test-test-test-test-test-test-test-test-test-test=
  expiration: 86400000
  reset-expiration: 600000
  header: Authorization

